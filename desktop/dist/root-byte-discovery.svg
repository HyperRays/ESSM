<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Full-root allocated-byte discovery benchmark</title>
  <desc id="desc">Mean elapsed time to discover increasing shares of allocated bytes. The desktop macOS ordering reaches every measured threshold sooner than default filesystem order across ten paired root scans.</desc>
  <rect width="1200" height="620" rx="18" fill="#0b1722"/>
  <text x="56" y="52" fill="#eef7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Large consumers surface earlier</text>
  <text x="56" y="80" fill="#8fa5b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Mean of 10 paired scans of / · 3.296 million entries · lower is earlier</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">
    <line x1="780" y1="70" x2="816" y2="70" stroke="#8297a8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="798" cy="70" r="5" fill="#8297a8"/>
    <text x="826" y="75" fill="#d9e7f2">Default order</text>
    <line x1="956" y1="70" x2="992" y2="70" stroke="#12bff3" stroke-width="4" stroke-linecap="round"/>
    <circle cx="974" cy="70" r="5" fill="#12bff3"/>
    <text x="1002" y="75" fill="#d9e7f2">Desktop macOS order</text>
  </g>

  <rect x="100" y="130" width="1030" height="360" fill="#101f2d" stroke="#294052"/>
  <g stroke="#294052" stroke-width="1">
    <line x1="100" y1="490" x2="1130" y2="490"/>
    <line x1="100" y1="430" x2="1130" y2="430"/>
    <line x1="100" y1="370" x2="1130" y2="370"/>
    <line x1="100" y1="310" x2="1130" y2="310"/>
    <line x1="100" y1="250" x2="1130" y2="250"/>
    <line x1="100" y1="190" x2="1130" y2="190"/>
    <line x1="100" y1="130" x2="1130" y2="130"/>
    <line x1="100" y1="130" x2="100" y2="490"/>
    <line x1="357.5" y1="130" x2="357.5" y2="490"/>
    <line x1="615" y1="130" x2="615" y2="490"/>
    <line x1="872.5" y1="130" x2="872.5" y2="490"/>
    <line x1="1130" y1="130" x2="1130" y2="490"/>
  </g>

  <g fill="#8fa5b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">
    <text x="85" y="495" text-anchor="end">0</text>
    <text x="85" y="435" text-anchor="end">5</text>
    <text x="85" y="375" text-anchor="end">10</text>
    <text x="85" y="315" text-anchor="end">15</text>
    <text x="85" y="255" text-anchor="end">20</text>
    <text x="85" y="195" text-anchor="end">25</text>
    <text x="85" y="135" text-anchor="end">30</text>
    <text x="100" y="518" text-anchor="middle">0%</text>
    <text x="357.5" y="518" text-anchor="middle">25%</text>
    <text x="615" y="518" text-anchor="middle">50%</text>
    <text x="872.5" y="518" text-anchor="middle">75%</text>
    <text x="1130" y="518" text-anchor="middle">100%</text>
    <text x="615" y="556" text-anchor="middle" fill="#d9e7f2" font-size="14">Eventual allocated bytes discovered</text>
    <text x="28" y="310" text-anchor="middle" transform="rotate(-90 28 310)" fill="#d9e7f2" font-size="14">Elapsed time (seconds)</text>
  </g>

  <polyline points="100,490 357.5,462.1 615,412.7 872.5,293.0 1027,215.3 1078.5,190.2 1130,149.2" fill="none" stroke="#8297a8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="100,490 357.5,469.1 615,434.9 872.5,331.4 1027,263.2 1078.5,214.9 1130,194.0" fill="none" stroke="#12bff3" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#8297a8">
    <circle cx="357.5" cy="462.1" r="5"/><circle cx="615" cy="412.7" r="5"/><circle cx="872.5" cy="293.0" r="5"/><circle cx="1027" cy="215.3" r="5"/><circle cx="1078.5" cy="190.2" r="5"/><circle cx="1130" cy="149.2" r="5"/>
  </g>
  <g fill="#12bff3" stroke="#0b1722" stroke-width="2">
    <circle cx="357.5" cy="469.1" r="6"/><circle cx="615" cy="434.9" r="6"/><circle cx="872.5" cy="331.4" r="6"/><circle cx="1027" cy="263.2" r="6"/><circle cx="1078.5" cy="214.9" r="6"/><circle cx="1130" cy="194.0" r="6"/>
  </g>

  <line x1="615" y1="412.7" x2="615" y2="434.9" stroke="#f4b942" stroke-width="2"/>
  <rect x="635" y="396" width="206" height="52" rx="8" fill="#172a3a" stroke="#355064"/>
  <text x="650" y="418" fill="#f4b942" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="700">50% found 1.85 s earlier</text>
  <text x="650" y="438" fill="#9fb3c3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">95% paired CI: 1.60–2.10 s</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">
    <text x="1116" y="139" text-anchor="end" fill="#aebfcc">28.40 s</text>
    <text x="1116" y="211" text-anchor="end" fill="#12bff3">24.67 s</text>
  </g>
  <text x="100" y="592" fill="#70889a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Allocated size of regular files · live filesystem · 785 protected directories were inaccessible</text>
</svg>
