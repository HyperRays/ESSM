<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cached-tree responsiveness benchmark</title>
  <desc id="desc">Grouped horizontal bars compare default order with the desktop macOS order. The desktop order reaches 25, 50, 75, and 90 percent of bytes sooner, while taking slightly longer to complete the small cached scan.</desc>
  <rect width="1200" height="650" rx="18" fill="#0b1722"/>
  <text x="56" y="52" fill="#eef7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700">Earlier insight has a small cached-tree cost</text>
  <text x="56" y="80" fill="#8fa5b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Mean of 30 paired scans · 78,830 entries · lower is better</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">
    <rect x="790" y="59" width="28" height="10" rx="5" fill="#8297a8"/>
    <text x="828" y="70" fill="#d9e7f2">Default order</text>
    <rect x="958" y="59" width="28" height="10" rx="5" fill="#12bff3"/>
    <text x="996" y="70" fill="#d9e7f2">Desktop macOS order</text>
  </g>

  <rect x="270" y="115" width="850" height="440" fill="#101f2d" stroke="#294052"/>
  <g stroke="#294052" stroke-width="1">
    <line x1="270" y1="115" x2="270" y2="555"/>
    <line x1="440" y1="115" x2="440" y2="555"/>
    <line x1="610" y1="115" x2="610" y2="555"/>
    <line x1="780" y1="115" x2="780" y2="555"/>
    <line x1="950" y1="115" x2="950" y2="555"/>
    <line x1="1120" y1="115" x2="1120" y2="555"/>
    <line x1="270" y1="205" x2="1120" y2="205"/>
    <line x1="270" y1="295" x2="1120" y2="295"/>
    <line x1="270" y1="385" x2="1120" y2="385"/>
    <line x1="270" y1="475" x2="1120" y2="475"/>
  </g>

  <g fill="#d9e7f2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" text-anchor="end">
    <text x="250" y="158">Discover 25%</text>
    <text x="250" y="248">Discover 50%</text>
    <text x="250" y="338">Discover 75%</text>
    <text x="250" y="428">Discover 90%</text>
    <text x="250" y="518">Complete scan</text>
  </g>

  <g fill="#8297a8">
    <rect x="270" y="132" width="513.8" height="17" rx="4"/>
    <rect x="270" y="222" width="513.8" height="17" rx="4"/>
    <rect x="270" y="312" width="573.5" height="17" rx="4"/>
    <rect x="270" y="402" width="579.7" height="17" rx="4"/>
    <rect x="270" y="492" width="666.7" height="17" rx="4"/>
  </g>
  <g fill="#12bff3">
    <rect x="270" y="158" width="230.0" height="17" rx="4"/>
    <rect x="270" y="248" width="303.5" height="17" rx="4"/>
    <rect x="270" y="338" width="379.9" height="17" rx="4"/>
    <rect x="270" y="428" width="485.1" height="17" rx="4"/>
    <rect x="270" y="518" width="765.4" height="17" rx="4"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="792" y="145" fill="#aebfcc">90.67 ms</text><text x="509" y="171" fill="#12bff3">40.59 ms</text>
    <text x="792" y="235" fill="#aebfcc">90.67 ms</text><text x="582" y="261" fill="#12bff3">53.56 ms</text>
    <text x="852" y="325" fill="#aebfcc">101.20 ms</text><text x="659" y="351" fill="#12bff3">67.05 ms</text>
    <text x="858" y="415" fill="#aebfcc">102.30 ms</text><text x="764" y="441" fill="#12bff3">85.61 ms</text>
    <text x="945" y="505" fill="#aebfcc">117.54 ms</text><text x="1044" y="531" fill="#12bff3">135.07 ms</text>
  </g>

  <g fill="#8fa5b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">
    <text x="270" y="580">0</text><text x="440" y="580">30</text><text x="610" y="580">60</text><text x="780" y="580">90</text><text x="950" y="580">120</text><text x="1120" y="580">150</text>
    <text x="695" y="612" fill="#d9e7f2" font-size="14">Elapsed time (milliseconds)</text>
  </g>
  <text x="270" y="636" fill="#f4b942" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">50% appears 37.11 ms earlier; full completion costs 17.53 ms</text>
</svg>
